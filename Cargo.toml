[package]
name = "ferro_pipeit"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9" # TODO: migrate to serde-saphyr when it reaches 1.0
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
