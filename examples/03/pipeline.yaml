name: data-processing-v3
tasks:
  init:
    cmd: "bash examples/03/scripts/init.sh"
    outputs:
      raw_data: "examples/03/data/raw.txt"

  process:
    cmd: "python3 examples/03/scripts/process.py"
    deps: ["init"]
    inputs:
      raw_data: "examples/03/data/raw.txt"
    outputs:
      processed: "examples/03/data/processed.txt"

  analyze:
    cmd: "node examples/03/scripts/analyze.js"
    deps: ["process"]
    inputs:
      processed: "examples/03/data/processed.txt"

  summary:
    cmd: "bash examples/03/scripts/summary.sh"
    deps: ["init", "analyze"]
    inputs:
      raw_data: "examples/03/data/raw.txt"
    outputs:
      summary: "examples/03/data/summary.txt"